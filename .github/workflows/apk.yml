name: Construir APK (Android)

# Se ejecuta solo cuando cambia la parte Android, o a mano desde la pestaña Actions.
# Los cambios de la web (index.html, bus.js, data/...) NO necesitan un APK nuevo:
# la app los toma sola la próxima vez que se abre.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle -p android assembleRelease --no-daemon
      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk MapaSalta.apk
      - name: Publicar para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Mapa Salta para Android (APK)
          body: Descargá MapaSalta.apk e instalalo en el celular. La app se actualiza sola con cada cambio de la web.
          files: MapaSalta.apk
          make_latest: true
