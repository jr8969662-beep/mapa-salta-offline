plugins { id 'com.android.application' }

android {
    namespace 'ar.salta.mapa'
    compileSdk 34

    defaultConfig {
        applicationId 'ar.salta.mapa'
        minSdk 24
        targetSdk 34
        // Cada compilación en GitHub sube el número, así la nueva versión se instala encima de la anterior.
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = '1.0'
    }
    signingConfigs {
        release {
            storeFile file('mapa-salta.keystore')
            storePassword 'mapasalta'
            keyAlias 'mapasalta'
            keyPassword 'mapasalta'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
