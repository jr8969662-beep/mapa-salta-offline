<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Salta Capital</title>

    <!-- Leaflet CSS (mapa) desde CDN por ahora -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .titulo {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="titulo">📍 Salta Capital</div>
    <div id="map"></div>

    <!-- Leaflet JS (mapa) desde CDN por ahora -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Coordenadas del centro de Salta Capital
        const CENTRO_SALTA = [-24.789, -65.411];

        // Crear el mapa
        const map = L.map('map').setView(CENTRO_SALTA, 14);

        // Capa de teselas de OpenStreetMap (por ahora online)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Un marcador en el centro para probar
        L.marker(CENTRO_SALTA)
            .addTo(map)
            .bindPopup('Centro de Salta Capital')
            .openPopup();
    </script>

</body>
</html>
