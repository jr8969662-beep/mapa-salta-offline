<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Salta Capital</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }

        /* Buscador */
        .buscador {
            position: absolute;
            top: 10px;
            left: 50px;
            right: 10px;
            z-index: 1000;
            max-width: 400px;
        }
        .buscador input {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        .resultados {
            list-style: none;
            margin: 4px 0 0 0;
            padding: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        .resultados.activo {
            display: block;
        }
        .resultados li {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 15px;
            color: #2c3e50;
        }
        .resultados li:last-child {
            border-bottom: none;
        }
        .resultados li:hover {
            background: #f0f8ff;
        }

        /* Punto azul de ubicación */
        .punto-usuario {
            width: 18px;
            height: 18px;
            background: #0078ff;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 120, 255, 0.8);
            animation: pulso 2s infinite;
        }
        @keyframes pulso {
            0%   { box-shadow: 0 0 10px rgba(0,120,255,0.8); }
            50%  { box-shadow: 0 0 20px rgba(0,120,255,1); }
            100% { box-shadow: 0 0 10px rgba(0,120,255,0.8); }
        }

        /* Punto de la calle buscada */
        .punto-calle {
            width: 14px;
            height: 14px;
            background: #e74c3c;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.9);
        }

        .aviso-ubicacion {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="buscador">
        <input type="text" id="inputBusqueda" placeholder="🔎 ¿Dónde queda...? Ej: Mitre">
        <ul class="resultados" id="listaResultados"></ul>
    </div>

    <div id="map"></div>
    <div class="aviso-ubicacion" id="aviso">Buscando tu ubicación...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const CENTRO_SALTA = [-24.789, -65.411];
        const map = L.map('map').setView(CENTRO_SALTA, 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // ============================
        // 1. UBICACIÓN DEL USUARIO
        // ============================
        let marcadorUsuario = null;
        let primerUbicacion = false;
        const iconoUsuario = L.divIcon({ className: 'punto-usuario', iconSize: [18, 18] });

        function actualizarUbicacion(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (marcadorUsuario) {
                marcadorUsuario.setLatLng([lat, lng]);
            } else {
                marcadorUsuario = L.marker([lat, lng], {
                    icon: iconoUsuario,
                    zIndexOffset: 1000
                }).addTo(map);
            }

            if (!primerUbicacion) {
                map.setView([lat, lng], 16);
                primerUbicacion = true;
                document.getElementById('aviso').style.display = 'none';
            }
        }

        function errorUbicacion(err) {
            console.warn('Error GPS:', err.message);
            document.getElementById('aviso').textContent = 'No se pudo obtener tu ubicación.';
        }

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(actualizarUbicacion, errorUbicacion, {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 5000
            });
        }

        // ============================
        // 2. BUSCADOR DE CALLES
        // ============================
        let callesIndex = [];       // Lista de calles con { nombre, lat, lng }
        let marcadorCalle = null;   // Último marcador de calle buscada

        // Cargar el GeoJSON y construir el índice
        async function cargarCalles() {
            try {
                document.getElementById('inputBusqueda').placeholder = '⏳ Cargando calles...';
                const resp = await fetch('data/calles.geojson');
                const data = await resp.json();

                data.features.forEach(f => {
                    const nombre = f.properties.name;
                    if (!nombre) return;

                    // El GeoJSON viene con "geometry.coordinates" gracias a "out geom"
                    let lat, lng;

                    if (f.geometry && f.geometry.type === 'LineString') {
                        // Tomamos el punto medio de la calle
                        const coords = f.geometry.coordinates;
                        const medio = coords[Math.floor(coords.length / 2)];
                        lng = medio[0];
                        lat = medio[1];
                    } else if (f.geometry && f.geometry.type === 'Polygon') {
                        const coords = f.geometry.coordinates[0];
                        const medio = coords[Math.floor(coords.length / 2)];
                        lng = medio[0];
                        lat = medio[1];
                    } else {
                        return;
                    }

                    callesIndex.push({
                        nombre: nombre.toLowerCase(),
                        nombreOriginal: nombre,
                        lat: lat,
                        lng: lng
                    });
                });

                // Sacar duplicados por nombre (mismo nombre, misma calle en varias partes)
                const unicas = {};
                callesIndex.forEach(c => {
                    if (!unicas[c.nombre]) unicas[c.nombre] = c;
                });
                callesIndex = Object.values(unicas);

                console.log(`✅ ${callesIndex.length} calles cargadas`);
                document.getElementById('inputBusqueda').placeholder = '🔎 ¿Dónde queda...? Ej: Mitre';
            } catch (e) {
                console.error('Error cargando calles:', e);
                document.getElementById('inputBusqueda').placeholder = '⚠️ Error al cargar calles';
            }
        }

        // Buscar calles que contengan el texto
        function buscarCalle(termino) {
            const t = termino.toLowerCase().trim();
            if (t.length < 2) return [];
            return callesIndex
                .filter(c => c.nombre.includes(t))
                .slice(0, 15);
        }

        // Mostrar resultados en la lista
        const input = document.getElementById('inputBusqueda');
        const lista = document.getElementById('listaResultados');

        input.addEventListener('input', (e) => {
            const resultados = buscarCalle(e.target.value);
            lista.innerHTML = '';

            if (resultados.length === 0) {
                lista.classList.remove('activo');
                return;
            }

            resultados.forEach(calle => {
                const li = document.createElement('li');
                li.textContent = calle.nombreOriginal;
                li.addEventListener('click', () => {
                    // Mover el mapa a la calle
                    map.setView([calle.lat, calle.lng], 17);

                    // Poner marcador rojo (sacamos el anterior si existe)
                    if (marcadorCalle) map.removeLayer(marcadorCalle);
                    marcadorCalle = L.marker([calle.lat, calle.lng], {
                        icon: L.divIcon({ className: 'punto-calle', iconSize: [14, 14] })
                    }).addTo(map).bindPopup(calle.nombreOriginal).openPopup();

                    // Cerrar la lista y limpiar input
                    lista.classList.remove('activo');
                    lista.innerHTML = '';
                    input.value = calle.nombreOriginal;
                    input.blur();
                });
                lista.appendChild(li);
            });

            lista.classList.add('activo');
        });

        // Ocultar resultados al hacer clic afuera
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.buscador')) {
                lista.classList.remove('activo');
            }
        });

        // Cargar las calles al iniciar
        cargarCalles();
    </script>

</body>
</html>
